<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Edits</title>
<link rel="stylesheet" href="/page/page.css">
</head>
<body>
<header id="top">
  <button id="listButton" class="quiet" title="Show or hide the file list">Files</button>
  <span id="title"></span>
  <nav id="views">
    <button data-view="pending">Pending <span class="count"></span></button>
    <button data-view="accepted">Accepted <span class="count"></span></button>
    <button data-view="all">All <span class="count"></span></button>
  </nav>
  <button id="historyButton" class="quiet">History</button>
</header>
<main>
  <aside id="list"></aside>
  <div id="splitter" title="Drag to size the list, double-click for its own size"></div>
  <section id="work">
    <div id="fileBar" hidden>
      <span id="filePath"></span>
      <span id="fileCounts"></span>
      <span class="spring"></span>
      <button id="previousChange" class="quiet" title="Previous change (Alt+↑)">↑</button>
      <button id="nextChange" class="quiet" title="Next change (Alt+↓)">↓</button>
      <span id="fileActions"></span>
    </div>
    <div id="editor"></div>
    <div id="note"></div>
  </section>
  <aside id="history" hidden>
    <div class="drawerHead"><b>History</b><button id="historyClose" class="quiet" title="Close">✕</button></div>
    <ol id="journal"></ol>
  </aside>
</main>
<footer id="waiting" hidden>
  <button id="waitingButton" class="quiet"></button>
  <ol id="waitingList" hidden></ol>
</footer>
<div id="toast" hidden></div>
<script src="/vs/loader.js"></script>
<script type="module" src="/page/page.js"></script>
</body>
</html>
