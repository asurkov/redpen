<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>redpen</title>
<meta name="redpen-code" content="">
<link rel="stylesheet" href="../../page/page.css">
<script>
  // Until the page has started, it watches its own code: a page whose code failed, or did not load (an
  // edit of it under way), loads again once that code changed and held still for two looks.
  (() => {
    const made = document.querySelector('meta[name="redpen-code"]').content;
    const files = `../../api/${location.pathname.split('/').at(-2)}/files`;
    let seen = null;
    const timer = setInterval(async () => {
      if (window.redpenStarted) {
        clearInterval(timer);
        return;
      }
      if (document.hidden) {
        return;
      }
      const now = await fetch(files).then(response => response.json()).then(listing => listing.page, () => null);
      if (made && now && now !== made && now === seen) {
        location.reload();
      }
      seen = now;
    }, 2000);
  })();
</script>
</head>
<body>
<header id="top">
  <button id="listButton" class="quiet" title="Files: show or hide the list" data-icon="files"><span class="label">Files</span></button>
  <button id="unchangedButton" class="quiet" title="Unchanged: show the unchanged files beside the changed ones; off, they wait behind “N more”" data-icon="unchanged" hidden><span class="label">Unchanged</span></button>
  <button id="reviewedButton" class="quiet" title="Reviewed: list the reviewed files, nothing of them pending, faded where they are; off, Pending leaves them out" data-icon="reviewed"><span class="label">Reviewed</span></button>
  <span id="title"></span>
  <span id="progress"></span>
  <button id="threadsButton" class="quiet" title="Next thread (t); the previous one: Shift+t" hidden></button>
  <nav id="views">
    <button data-view="pending">Pending <span class="count"></span></button>
    <button data-view="accepted">Accepted <span class="count"></span></button>
    <button data-view="all">All <span class="count"></span></button>
  </nav>
  <button id="acceptAllButton" class="quiet" title="Accept everything pending, as one History line, which Undo or Cmd+Z takes back" hidden>Accept all</button>
  <button id="overviewButton" class="quiet" title="Overview: the changes by purpose, as Claude describes them, each part a way to its code" data-icon="overview"><span class="label">Overview</span></button>
  <button id="historyButton" class="quiet" title="History: what was accepted and rejected, each with Undo; Cmd+Z undoes the last, Cmd+Shift+Z redoes it" data-icon="history"><span class="label">History</span></button>
</header>
<main>
  <aside id="list"></aside>
  <div id="splitter" title="Drag to size the list, double-click for its own size"></div>
  <section id="work">
    <div id="fileBar" hidden>
      <span id="filePath"></span>
      <span id="fileCounts"></span>
      <span class="spring"></span>
      <span id="fileActions"></span>
      <!-- Last, so they stand in one place whatever the view's actions are. -->
      <button id="goOnButton" class="quiet" title="Go on (g): Accept, Reject and Unaccept, by button or key, then go on to the next change; off, they stay on it">Go on</button>
      <button id="previousChange" class="quiet" title="Previous change (p)">↑</button>
      <button id="nextChange" class="quiet" title="Next change (n)">↓</button>
    </div>
    <div id="editor"></div>
    <div id="images" hidden></div>
    <div id="note"></div>
  </section>
  <aside id="overview" hidden>
    <div class="drawerHead">
      <b>Overview</b>
      <span class="spring"></span>
      <button id="previousBlock" class="quiet" title="The overview's previous block">↑</button>
      <button id="nextBlock" class="quiet" title="The overview's next block">↓</button>
      <button id="describeButton" class="quiet" title="Ask Claude to describe the changes">Describe</button>
      <button id="overviewClose" class="quiet" title="Close">✕</button>
    </div>
    <div id="outline"></div>
  </aside>
  <aside id="history" hidden>
    <div class="drawerHead"><b>History</b><button id="historyClose" class="quiet" title="Close">✕</button></div>
    <ol id="journal"></ol>
  </aside>
</main>
<footer id="waiting" hidden>
  <button id="waitingButton" class="quiet"></button>
  <ol id="waitingList" hidden></ol>
</footer>
<div id="toast" hidden></div>
<script src="../../vs/loader.js"></script>
<script type="module" src="../../page/page.js"></script>
</body>
</html>
